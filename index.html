<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Morning — a calm start to your day</title>
<meta name="description" content="Replace morning doomscrolling with a short, science-informed cognitive warm-up.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<noscript>This app requires JavaScript to run.</noscript>

<div id="app">
  <header class="top-bar">
    <div class="brand">Brain Morning</div>
    <nav class="top-nav" id="top-nav" aria-label="Primary navigation"></nav>
  </header>

  <main id="view-root" role="main" aria-live="polite" aria-busy="false">
    <div id="boot-message" style="padding:40px 20px;text-align:center;opacity:0.6;">Loading…</div>
  </main>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Primary navigation"></nav>
</div>

<script>
/* Last-resort guard: if any script fails to load or throws before the app
   renders, show the reason instead of a blank white screen. */
window.addEventListener('error', function (e) {
  var boot = document.getElementById('boot-message');
  if (boot && boot.parentNode) {
    boot.style.opacity = '1';
    boot.style.textAlign = 'left';
    boot.innerHTML = '<strong>The app failed to start.</strong><br><br>' +
      '<span style="font-size:0.8rem;opacity:0.75;">' +
      String(e.message || e.type) + '</span>';
  }
});
</script>

<!-- Content data -->
<script src="data/french-vocabulary.js"></script>
<script src="data/questions.js"></script>

<!-- Core layer -->
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/exercises.js"></script>

<!-- Exercise modules (register themselves with Exercises) -->
<script src="js/memory.js"></script>
<script src="js/attention.js"></script>
<script src="js/motor.js"></script>
<script src="js/reasoning.js"></script>
<script src="js/french.js"></script>

<!-- Feature modules -->
<script src="js/flashcards.js"></script>
<script src="js/progress.js"></script>

<!-- App shell -->
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
